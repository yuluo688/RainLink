name: rainlink
description: RainLink cross-platform proxy client.
publish_to: 'none'
version: 0.1.0+4

environment:
  sdk: ^3.6.2
  flutter: '>=3.27.4'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  flutter_svg: 2.0.17
  go_router: 14.8.1
  drift: 2.24.0
  crypto: 3.0.7
  yaml: 3.1.4
  path: 1.9.0
  path_provider: 2.1.5
  file_selector: 1.0.3
  sqlite3_flutter_libs: 0.5.29
  screen_retriever: 0.2.2
  window_manager: 0.4.3
  stack_trace: 1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 5.0.0
  build_runner: 2.4.14
  drift_dev: 2.24.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/brand/
    - assets/flags/
    - assets/licenses/
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/NotoSansSC-OFL.txt
    - assets/fonts/RobotoMono-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC.ttf
          weight: 600
    - family: Roboto Mono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
          weight: 400
        - asset: assets/fonts/RobotoMono.ttf
          weight: 500
